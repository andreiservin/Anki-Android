name: Compilar HALO V29 Universal

on:
  push:
    branches:
      - halo-v29-dev1-opciones-halo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Fabricar APK universal firmado
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar código V29
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verificar clave de firma
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/fallback-release-keystore.jks

          keytool -list \
            -keystore tools/fallback-release-keystore.jks \
            -storepass "Test@123" \
            -alias "my-key"

      - name: Compilar aplicación completa firmada
        shell: bash
        env:
          KEYSTOREPATH: ${{ github.workspace }}/tools/fallback-release-keystore.jks
          KEYSTOREPWD: Test@123
          KSTOREPWD: Test@123
          KEYALIAS: my-key
          KEYPWD: Test@123
        run: |
          set -euo pipefail
          chmod +x gradlew

          BUILD_TIME="$(date +%s%3N)"

          MINIFY_ENABLED=false \
          ./gradlew :AnkiDroid:assembleFullRelease \
            -Duniversal-apk=true \
            -PbuildTime="$BUILD_TIME" \
            --no-daemon \
            --stacktrace

      - name: Verificar APK antes de publicarlo
        shell: bash
        run: |
          set -euo pipefail

          APK="AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-universal-release.apk"

          if [ ! -f "$APK" ]; then
            echo "No se encontró el APK esperado."
            find AnkiDroid/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          BUILD_TOOLS="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d |
            sort -V |
            tail -n 1
          )"

          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          echo "=== INTEGRIDAD ZIP ==="
          unzip -t "$APK"

          echo "=== ALINEACIÓN APK ==="
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          echo "=== FIRMA APK ==="
          mkdir -p resultado

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" |
            tee resultado/FIRMA_APK.txt

          cp "$APK" \
            resultado/AnkiDroid-HALO-V29-DEV1-universal.apk

          cd resultado

          sha256sum \
            AnkiDroid-HALO-V29-DEV1-universal.apk \
            > SHA256SUMS.txt

          ls -lh
          cat FIRMA_APK.txt

      - name: Publicar APK verificado
        uses: actions/upload-artifact@v4
        with:
          name: AnkiDroid-HALO-V29-DEV1-universal
          path: resultado/*
          if-no-files-found: error
